name: CI

# Every package is checked on every push, not only the one that changed: the web app and the
# token server share protocol details that live in two copies on purpose (livekitRoomName, the
# xyz.nekous.* event shapes), so a change to one side is exactly when the other side's tests are
# worth running.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches apps/web/Dockerfile's builder stage (node:24-alpine).
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Catches what none of the above can: a module that typechecks but can't actually be
      # bundled (a bad dynamic import, a worker path, a CSS reference to a missing file).
      - run: npm run build

  # The app against a real homeserver in a real browser: sign-in, messages, reactions, posts,
  # notification settings, and end-to-end encryption between two browsers — what unit tests with a
  # mocked client can't reach. See apps/web/e2e/README.md.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:homeserver
      - run: npm run build
      - run: npm run e2e
      - name: Homeserver log
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs matrix
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  token-server:
    name: token-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/token-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches services/token-server/Dockerfile (node:22-alpine).
          node-version: '22'
          cache: npm
          cache-dependency-path: services/token-server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  push-gateway:
    name: push-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/push-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches services/push-gateway/Dockerfile (node:22-alpine).
          node-version: '22'
          cache: npm
          cache-dependency-path: services/push-gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Two Purrlor instances federating on one machine (deploy/test/federation): two homeservers, two
  # token servers built from this checkout, and Caddy for federation's TLS. They're peered through
  # their real control sockets, then scenario.mjs checks what each side's people and public web can
  # read, and deploy/federation-check.mjs the homeserver behaviour it rests on (docs/federation.md).
  federation:
    name: federation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash deploy/test/federation/run.sh

  # The `purrlor` admin, backup and alert commands against stand-ins for curl, docker and scp, and
  # a syntax check of the install scripts: no Docker or socket needed (docs/admin.md).
  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/purrlor && bash -n deploy/setup.sh
      - run: bash deploy/test/purrlor-control.test.sh
      - run: bash deploy/test/purrlor-email.test.sh
      - run: bash deploy/test/purrlor-backup.test.sh
