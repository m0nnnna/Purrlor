# What the end-to-end tests run against: Continuwuity, the homeserver deploy/docker-compose.yml
# bundles, on its own, and the token server built from this checkout (for webhooks). The
# homeserver's database is a tmpfs, so every `up` is a brand-new server and no test can depend on
# what an earlier run left behind. start-homeserver.sh brings both up.
name: purrlor-e2e

services:
  matrix:
    # E2E_HOMESERVER_IMAGE points it at a mirror (e2e/README.md), for places that can't reach forgejo.ellis.link.
    image: ${E2E_HOMESERVER_IMAGE:-forgejo.ellis.link/continuwuation/continuwuity:latest}
    ports:
      - '127.0.0.1:6167:8008'
    environment:
      CONTINUWUITY_SERVER_NAME: localhost
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_PORT: 8008
      CONTINUWUITY_ALLOW_REGISTRATION: 'true'
      # What the tests register with (E2E_REGISTRATION_TOKEN). It only works once the server's
      # first account exists, which start-homeserver.sh creates with the one-time bootstrap token.
      CONTINUWUITY_REGISTRATION_TOKEN: e2e-registration-token
      # On, as deployed: it serves the federation API, whose OpenID userinfo is how the token
      # server checks who's asking (the online count's ping). It has no other server to talk to.
      CONTINUWUITY_ALLOW_FEDERATION: 'true'
      CONTINUWUITY_NEW_USER_DISPLAYNAME_SUFFIX: ''
    tmpfs:
      - /var/lib/continuwuity

  # Its bot account (e2e-bot) is registered by bootstrap.mjs; it logs in on its first request.
  # LiveKit isn't running: the tests don't make calls, and the key pair only has to be present.
  token-server:
    build:
      context: ../../..
      dockerfile: services/token-server/Dockerfile
    ports:
      - '127.0.0.1:6168:3001'
    environment:
      PORT: 3001
      LIVEKIT_API_KEY: e2e-key
      LIVEKIT_API_SECRET: e2e-secret-that-is-long-enough-for-livekit
      ALLOWED_ORIGINS: '*'
      MATRIX_HOMESERVER_URL: http://matrix:8008
      MATRIX_BOT_USERNAME: e2e-bot
      MATRIX_BOT_PASSWORD: e2e-bot-password
    depends_on:
      - matrix
