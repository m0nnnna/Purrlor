# Serves the built SPA, falling back to index.html for client-side routing (react-router-dom).
server {
  listen 80;
  listen [::]:80;

  root /usr/share/nginx/html;

  # CSP, framing, HSTS and friends (security-headers.conf). Repeated in each location below that adds
  # a header of its own: nginx forgets the server's add_header lines in such a location.
  include /etc/nginx/purrlor/security-headers.conf;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Older nginx images don't know the type; browsers want it to install the app.
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
  }

  # Written at container start (40-purrlor-config.sh) and changes whenever .env does — never let a
  # browser keep serving a stale homeserver lock.
  location = /config.json {
    include /etc/nginx/purrlor/security-headers.conf;
    add_header Cache-Control "no-store";
  }
}
