# Serves the built SPA, falling back to index.html for client-side routing (react-router-dom).
server {
  listen 80;
  listen [::]:80;

  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Older nginx images don't know the type; browsers want it to install the app.
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
  }

  # Written at container start (40-purrlor-config.sh) and changes whenever .env does — never let a
  # browser keep serving a stale homeserver lock.
  location = /config.json {
    add_header Cache-Control "no-store";
  }
}
