# Security headers for the web app (docs/deployment.md, "Security headers"). nginx.conf includes this
# in every location that sets headers of its own, since nginx drops the server's add_header lines
# in a location that has any. vite.config.ts reads this same file for `vite preview`, so the
# end-to-end tests run under exactly this policy.
#
# The Content-Security-Policy is what matters most: the Matrix access token is kept in the page
# (localStorage), so a script injected into it could take over the account. Scripts only come from
# this site, the YouTube player (watch parties) and WebAssembly (Matrix's encryption); there is no
# inline script and no eval. Connections and images may go to any https server, since the homeserver,
# a Space's voice server, a push gateway and other people's media are wherever their owners put them.
# Styles and fonts are this site's and Google Fonts' only, which also keeps a theme's @import and
# fonts from fetching anything else (app/themeSanitize.ts covers the rest).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://open.spotify.com https://w.soundcloud.com https://clips.twitch.tv https://player.twitch.tv https://streamable.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# No other site may show the app in a frame (clickjacking); frame-ancestors above, for older browsers.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# YouTube's player needs the origin to play; nothing more than the origin leaves for other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Camera, microphone and screen sharing for calls, from this site only; nothing else asks.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=()" always;
# HTTPS only, for a year, for the app's own address (browsers ignore it over plain HTTP).
add_header Strict-Transport-Security "max-age=31536000" always;
